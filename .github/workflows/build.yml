name: Build CLI rpi-imager

on:
  workflow_dispatch:
  push:
    branches: [ cli-patch ]
  schedule:
    - cron: "0 12 * * 0"  # weekly check/build

jobs:
  build:
    runs-on: windows-latest
    steps:
      # 1. Checkout your branch
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Fetch upstream
      - name: Fetch upstream qml
        run: |
          git remote add upstream https://github.com/raspberrypi/rpi-imager.git
          git fetch upstream

      # 3. Create build branch from upstream/qml
      - name: Create build branch
        run: git checkout -B build-branch upstream/qml

      # 4. Merge your cli-patch branch to preserve patches folder
      - name: Merge cli-patch branch
        run: git merge cli-patch --allow-unrelated-histories -m "Merge cli-patch into build-branch"

      # 5. Apply CLI patch
      - name: Apply CLI patch
        run: git apply --whitespace=fix patches/0001-cli-friendly.patch

      # 6. Setup Qt 6.9 Mingw64
      - name: Setup Qt 6.9 Mingw64
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.9
          host: windows
          target: desktop          # Must be 'desktop'
          arch: win64_mingw        # 64-bit Mingw toolchain
          dir: C:\Qt

      # 7. Configure build
      - name: Configure CMake
        run: cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      # 8. Build
      - name: Build rpi-imager
        run: cmake --build build --config Release

      # 9. Package artifact
      - name: Package artifact
        run: |
          mkdir dist
          copy build\rpi-imager.exe dist\rpi-imager.exe
          powershell Compress-Archive dist\rpi-imager.exe rpi-imager-cli-win64.zip

      # 10. Upload artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpi-imager-cli
          path: rpi-imager-cli-win64.zip
