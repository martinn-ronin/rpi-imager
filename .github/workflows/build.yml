name: Build CLI rpi-imager

on:
  workflow_dispatch:
  push:
    branches: [ cli-patch ]
  schedule:
    - cron: "0 12 * * 0"  # weekly check/build

jobs:
  build:
    runs-on: windows-latest
    steps:
      # 1. Checkout your branch
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Add upstream remote and fetch qml branch
      - name: Fetch upstream qml branch
        run: |
          git remote add upstream https://github.com/raspberrypi/rpi-imager.git
          git fetch upstream qml

      # 3. Create local build branch based on upstream/qml
      - name: Create build branch
        run: git checkout upstream/qml -B build-branch

      # 4. Apply CLI patch
      - name: Apply CLI patch
        run: git apply --whitespace=fix patches/0001-cli-friendly.patch

      # 5. Merge your cli-patch branch (contains workflow + patch folder)
      - name: Merge cli-patch branch
        run: git merge cli-patch --allow-unrelated-histories -m "Merge cli-patch"

      # 6. Setup Qt 6.9 with Mingw64
      - name: Setup Qt 6.9 Mingw64
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.9
          host: windows
          target: win64_mingw
          dir: C:\Qt

      # 8. Configure build
      - name: Configure CMake
        run: cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      # 9. Build
      - name: Build rpi-imager
        run: cmake --build build --config Release

      # 10. Package artifact
      - name: Package artifact
        run: |
          mkdir dist
          copy build\rpi-imager.exe dist\rpi-imager.exe
          powershell Compress-Archive dist\rpi-imager.exe rpi-imager-cli-win64.zip

      # 11. Upload artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpi-imager-cli
          path: rpi-imager-cli-win64.zip
