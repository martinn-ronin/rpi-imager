name: Build CLI rpi-imager

on:
  workflow_dispatch:  # manual trigger
  push:
    branches: [ cli-patch ]
  schedule:
    - cron: "0 12 * * 0"  # weekly check

jobs:
  build:
    runs-on: windows-latest
    steps:
      # 1. Checkout your repo
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Fetch upstream
      - name: Fetch upstream qml
        run: |
          git remote add upstream https://github.com/raspberrypi/rpi-imager.git
          git fetch upstream

      # 3. Create build branch from upstream/qml
      - name: Create build branch
        run: git checkout -B build-branch upstream/qml

      # 4. Merge your cli-patch branch to preserve patches folder
      - name: Merge cli-patch branch
        run: git merge cli-patch --allow-unrelated-histories -m "Merge cli-patch into build-branch"

      # 5. Apply CLI patch
      - name: Apply CLI patch
        run: git apply --whitespace=fix patches/0001-cli-friendly.patch

      # 6. Install Qt + Mingw64 toolchain
      - name: Install dependencies
        run: |
          choco install -y qt6-setup ninja cmake

      # 7. Configure CMake
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      # 8. Build
      - name: Build
        run: cmake --build build --config Release

      # 9. Package artifact (all necessary files for .exe)
      - name: Package artifact
        run: |
          mkdir dist
          xcopy build\*.* dist /E /I /Y
          powershell Compress-Archive -Path dist\* -DestinationPath rpi-imager-cli-win64.zip

      # 10. Upload artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpi-imager-cli
          path: rpi-imager-cli-win64.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/cli-patch'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: rpi-imager-cli

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cli-$(date +'%Y%m%d')
          name: "CLI rpi-imager build $(date +'%Y-%m-%d')"
          files: rpi-imager-cli-win64.zip
